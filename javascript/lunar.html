<!DOCTYPE html>
<html>
<head>
    <title>Lunar Calendar</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            font-family: 'Segoe UI', 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #f0f0f0;
        }
        .card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid #f9a8d4;
            text-align: center;
            width: 350px;
        }
        h1 {
            color: #f9a8d4;
            font-size: 1.8rem;
        }
        input, button {
            padding: 0.6rem;
            border-radius: 2rem;
            border: none;
            margin: 0.5rem;
            font-size: 1rem;
        }
        input {
            background: #1e293b;
            color: white;
            text-align: center;
        }
        button {
            background: #f9a8d4;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #c084fc;
            transform: scale(1.02);
        }
        .result {
            margin-top: 1.5rem;
            font-size: 1.5rem;
        }
        .moon-emoji {
            font-size: 4rem;
            margin: 1rem 0;
        }
        footer {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🌙 Lunar Calendar</h1>
    <input type="date" id="datePicker" />
    <button onclick="calculatePhase()">Show Moon Phase</button>
    <div class="result" id="result">
        <div class="moon-emoji" id="moonEmoji">🌕</div>
        <div id="phaseName">Full Moon</div>
        <div id="illumination"></div>
    </div>
    <footer>Astronomical algorithm • Marina Matarova</footer>
</div>
<script>
    function moonPhase(year, month, day) {
        if (month < 3) {
            year--;
            month += 12;
        }
        let a = Math.floor(year / 100);
        let b = Math.floor(a / 4);
        let c = 2 - a + b;
        let e = Math.floor(365.25 * (year + 4716));
        let f = Math.floor(30.6001 * (month + 1));
        let jd = c + day + e + f - 1524.5;
        let daysSinceNew = jd - 2451549.5;
        let newMoons = daysSinceNew / 29.53;
        let phase = (newMoons - Math.floor(newMoons)) * 29.53;
        return phase;
    }

    function phaseNameAndEmoji(phase) {
        if (phase < 1.845) return { name: "New Moon", emoji: "🌑" };
        if (phase < 5.535) return { name: "Waxing Crescent", emoji: "🌒" };
        if (phase < 9.225) return { name: "First Quarter", emoji: "🌓" };
        if (phase < 12.915) return { name: "Waxing Gibbous", emoji: "🌔" };
        if (phase < 16.605) return { name: "Full Moon", emoji: "🌕" };
        if (phase < 20.295) return { name: "Waning Gibbous", emoji: "🌖" };
        if (phase < 23.985) return { name: "Last Quarter", emoji: "🌗" };
        return { name: "Waning Crescent", emoji: "🌘" };
    }

    function illumination(phase) {
        return (50 - 50 * Math.cos(2 * Math.PI * phase / 29.53)).toFixed(1);
    }

    function calculatePhase() {
        const dateInput = document.getElementById('datePicker').value;
        let date = dateInput ? new Date(dateInput) : new Date();
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const phase = moonPhase(year, month, day);
        const { name, emoji } = phaseNameAndEmoji(phase);
        const illum = illumination(phase);
        document.getElementById('moonEmoji').innerHTML = emoji;
        document.getElementById('phaseName').innerHTML = name;
        document.getElementById('illumination').innerHTML = `${illum}% illuminated`;
    }
    // set default to today
    document.getElementById('datePicker').valueAsDate = new Date();
    calculatePhase();
</script>
</body>
</html>
